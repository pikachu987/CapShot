<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CapShot (캡샷) - 웹 비디오 / GIF 프레임 추출기</title>
    <meta name="description" content="설치 없이 웹에서 즉시 동영상과 GIF의 프레임을 정밀하게 탐색하고 고화질 이미지로 추출하세요. 100% 로컬에서 작동하여 개인정보를 완벽히 보호합니다.">
    
    <!-- Open Graph / SEO -->
    <meta property="og:title" content="CapShot (캡샷) - 웹 비디오 / GIF 프레임 추출기">
    <meta property="og:description" content="동영상, GIF 프레임을 1프레임 단위로 미세 조절하고 고해상도로 추출하세요.">
    <meta property="og:type" content="website">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="app.css?v=5.7">
</head>
<body>
    <div id="app-container">
        <!-- Header -->
        <header class="app-header">
            <button id="btn-back-header" class="btn-back-header" style="display: none;" title="뒤로가기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px; display: block;">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="header-center-area">
                <div class="header-logo">
                    <svg viewBox="0 0 24 24" class="logo-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="14.31" y1="8" x2="20.05" y2="17.94"></line>
                        <line x1="9.69" y1="8" x2="21.17" y2="8"></line>
                        <line x1="7.38" y1="12" x2="13.12" y2="2.06"></line>
                        <line x1="9.69" y1="16" x2="3.95" y2="6.06"></line>
                        <line x1="14.31" y1="16" x2="2.83" y2="16"></line>
                        <line x1="16.62" y1="12" x2="10.88" y2="21.94"></line>
                    </svg>
                    <span class="logo-text">CapShot <span class="logo-badge">Web</span></span>
                </div>
            </div>
            <div class="header-actions">
                <button id="btn-settings-header" class="header-action-btn" style="display: none;" title="내보내기 설정">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 21px; height: 21px; display: block;">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <button id="btn-info-header" class="header-action-btn" style="display: none;" title="미디어 정보">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px; display: block;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                </button>
            </div>
            <div id="settings-popover" class="info-popover settings-popover" style="display: none;">
                <div class="settings-group">
                    <h2 class="section-title">내보내기 설정</h2>
                    <div class="format-selector">
                        <button class="format-tab active" data-format="png">PNG</button>
                        <button class="format-tab" data-format="jpeg">JPEG</button>
                        <button class="format-tab" data-format="webp">WebP</button>
                    </div>
                </div>
                <div id="quality-setting" class="settings-group" style="display: none;">
                    <div class="slider-header">
                        <h2 class="section-title">품질</h2>
                        <span id="quality-value">90%</span>
                    </div>
                    <input type="range" id="export-quality" min="10" max="100" value="90">
                </div>
            </div>
            <div id="info-popover" class="info-popover" style="display: none;">
                <p id="info-name" class="info-popover-name">-</p>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">유형</span>
                        <span id="info-type" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">해상도</span>
                        <span id="info-resolution" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">총 프레임</span>
                        <span id="info-frames" class="info-value">-</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="app-main">
            <!-- Dropzone: Shown when no media is loaded -->
            <div id="dropzone" class="media-dropzone">
                <div class="dropzone-content">
                    <div class="glow-ring"></div>
                    <svg viewBox="0 0 24 24" class="upload-icon" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <h3>미디어 파일 선택</h3>
                    <p class="dropzone-hint">동영상(.mp4, .mov) 또는 .gif 파일을 이곳에 드래그하여 놓거나 파일을 선택하세요.</p>
                    
                    <label for="file-input" class="btn btn-primary select-btn">
                        파일 찾기
                    </label>
                    <input type="file" id="file-input" accept="video/*,image/gif" style="display: none;">
                    

                    
                    <span class="privacy-note">
                        <svg viewBox="0 0 24 24" class="privacy-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        모든 미디어 처리는 기기 내부에서 100% 로컬로 안전하게 진행됩니다.
                    </span>
                </div>
            </div>

            <!-- Workspace: Shown when media is loaded -->
            <div id="workspace" class="workspace-layout" style="display: none;">
                <!-- Left Panel: Preview & Timeline -->
                <div class="preview-panel">
                    <!-- Canvas Container -->
                    <div class="canvas-container">
                        <canvas id="preview-canvas"></canvas>
                        <div id="crop-overlay" class="crop-overlay" style="display: none;">
                            <div id="crop-box" class="crop-box">
                                <div id="crop-size" class="crop-size-label"></div>
                                <div class="crop-grid"></div>
                                <div class="crop-handle" data-handle="tl"></div>
                                <div class="crop-handle" data-handle="tr"></div>
                                <div class="crop-handle" data-handle="bl"></div>
                                <div class="crop-handle" data-handle="br"></div>
                            </div>
                        </div>
                        <div id="preview-controls" class="preview-controls" style="display: none;">
                            <button id="btn-rotate-view" class="preview-ctrl-btn" title="90° 회전">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="10" height="10" rx="2"></rect>
                                    <path d="M13 8V6a3 3 0 0 1 3-3h4"></path>
                                    <polyline points="17.5 6 20 3 17.5 0.5"></polyline>
                                </svg>
                                <span class="ctrl-badge">90°</span>
                            </button>
                            <button id="btn-reset-view" class="preview-ctrl-btn" title="크롭 · 확대 초기화">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="1 4 1 10 7 10"></polyline>
                                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                                </svg>
                            </button>
                        </div>
                        <div id="loading-overlay" class="loading-overlay" style="display: none;">
                            <div class="spinner"></div>
                            <span id="loading-message">프레임 추출 중...</span>
                        </div>
                    </div>

                    <!-- Custom Timeline Controls -->
                    <div class="timeline-container">
                        <!-- Thumbnails track -->
                        <div class="timeline-track-container">
                            <div id="timeline-thumbnails" class="timeline-thumbnails"></div>
                            <div class="timeline-playhead-clip">
                                <div class="timeline-playhead-line"></div>
                            </div>
                            <div id="timeline-playhead" class="timeline-playhead"></div>
                        </div>

                        <!-- Stepper & Playback controls -->
                        <div class="playback-controls">
                            <div class="time-display">
                                <span id="current-time">00:00.00</span>
                                <span class="time-separator">/</span>
                                <span id="total-time">00:00.00</span>
                            </div>

                            <!-- Detail dial: fine scrubbing ruler, synced with the top timeline -->
                            <div class="detail-dial-container">
                                <canvas id="detail-dial"></canvas>
                            </div>

                            <div class="frame-display">
                                <span id="frame-counter">프레임: 0 / 0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Panel: Save action (export settings live in the header gear popover) -->
                <div class="control-panel">
                    <div class="panel-section action-section">
                        <button id="btn-extract" class="btn btn-primary btn-large btn-glow btn-extract-sticky">
                            <svg viewBox="0 0 24 24" class="btn-icon-svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            저장
                        </button>
                        <p class="keyboard-hint">단축키: <span>Space</span> 재생/정지, <span>←</span> 이전 프레임, <span>→</span> 다음 프레임, <span>Enter</span> 추출</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden Video Tag for playback -->
    <video id="source-video" style="display: none;" playsinline></video>

    <!-- Script Import (ES Module) -->
    <script type="module" src="app.js?v=5.4"></script>
</body>
</html>
